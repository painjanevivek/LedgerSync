  /developer/metadata:
    get:
      operationId: getDeveloperMetadata
      x-required-scope: developer:read
      summary: Read the bounded, versioned, non-secret developer example catalogue.
      description: Requires developer:read. This static response contains no credential values and cannot execute requests.
      responses:
        '200':
          description: Canonical developer metadata synchronized with this OpenAPI contract.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperMetadata' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/credentials:
    get:
      operationId: listDeveloperCredentials
      x-required-scope: credentials:read
      summary: List bounded external credential metadata without credential values.
      description: Returns reviewed identity-provider references, scopes, expiry, version, revocation, and rate-bounded last-used evidence. Raw credentials are never stored or returned.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, expired, revoked] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Stable credential metadata page., content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperCredentialPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createDeveloperCredential
      x-required-scope: credentials:write
      summary: Register an external credential reference and bounded authorization metadata.
      description: Requires recent production step-up authentication. The identity provider or secret manager issues the raw credential; LedgerSync accepts only its non-secret reference.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDeveloperCredentialRequest' } } } }
      responses:
        '201': { description: Credential metadata created or replayed., headers: { Idempotent-Replay: { schema: { type: string, enum: ['true'] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperCredential' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/credentials/{credentialId}:
    get:
      operationId: getDeveloperCredential
      x-required-scope: credentials:read
      summary: Read one tenant-scoped external credential metadata record.
      parameters: [{ $ref: '#/components/parameters/CredentialID' }]
      responses:
        '200': { description: Credential metadata., content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperCredential' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
