openapi: 3.1.0
info:
  title: LedgerSync Private API
  version: 3.2.0
  description: >-
    Closed-loop single-currency ledger API behind the LedgerSync BFF. Exact
    minor units and monotonic versions are JSON strings. A timed-out transfer
    has an unknown outcome and must be retried with the identical payload and
    Idempotency-Key. Account and controlled-funding command timeouts follow the
    same retry rule. Funding records external value evidence; it does not claim
    bank settlement, custody, or movement outside this ledger.
  license: { name: Apache License 2.0, identifier: Apache-2.0 }
servers: [{ url: /api }]
security: [{ bearerAuth: [], actorAssertion: [] }]
x-ledgersync-lifecycle:
  semantic_version: 3.2.0
  supported_window: current minor and immediately preceding minor, with at least 180 days notice before sunset
  changelog: ./CHANGELOG.md
  policy: ./api-lifecycle-policy.md
  response_headers: [X-Request-ID, X-LedgerSync-API-Version, X-LedgerSync-Mode]
  modes: [sandbox, production]
paths:

  /accounts:
    post:
      operationId: createAccount
      x-required-scope: accounts:write
      summary: Create an owned INR account with exact zero balances.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAccountRequest' } } }
      responses:
        '201':
          description: Original or safely replayed account creation outcome.
          headers: { Idempotent-Replay: { schema: { type: string, enum: ['true'] } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCommandResult' }
              examples:
                original: { $ref: '#/components/examples/AccountCreateOriginal' }
                replay: { $ref: '#/components/examples/AccountCreateReplay' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/AccountNotZero' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AccountCommandUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/accounts:
    get:
      operationId: listOwnedAccounts
      x-required-scope: accounts:read
      summary: List accounts visible to the authenticated subject.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { in: query, name: q, description: 'Case-insensitive display-name or external-reference prefix, or an exact account UUID.', schema: { type: string, maxLength: 128 } }
        - { in: query, name: status, schema: { type: string, enum: [active, frozen, closed] } }
        - { in: query, name: category, schema: { type: string, enum: [operating, customer_funds, payroll, payables, expenses, reserve] } }
      responses:
        '200': { description: Owned accounts and balances., content: { application/json: { schema: { $ref: '#/components/schemas/AccountList' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /accounts/{accountId}:
    get:
      operationId: getOwnedAccount
      x-required-scope: accounts:read
      summary: Read one account visible to the authenticated subject without disclosing inaccessible records.
      parameters: [{ $ref: '#/components/parameters/AccountID' }]
      responses:
        '200': { description: 'Authorized account identity, current balance, and permitted account-targeted audit context.', content: { application/json: { schema: { $ref: '#/components/schemas/AccountDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: updateAccount
      x-required-scope: accounts:write
      summary: Replace mutable account metadata or request one lifecycle transition.
      parameters: [{ $ref: '#/components/parameters/AccountID' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchAccountRequest' } } }
      responses:
        '200':
          description: Original or safely replayed account mutation outcome.
          headers: { Idempotent-Replay: { schema: { type: string, enum: ['true'] } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountCommandResult' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/AccountNotZero' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AccountCommandUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /accounts/{accountId}/balance:
    get:
      operationId: getAccountBalance
      x-required-scope: accounts:read
      summary: Read an authorized current balance.
      parameters: [{ $ref: '#/components/parameters/AccountID' }, { $ref: '#/components/parameters/ConsistencyRequirement' }]
      responses:
        '200': { description: Requirement-bearing balance., content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /accounts/{accountId}/transactions:
    get:
      operationId: listAccountTransactions
      x-required-scope: transactions:read
      summary: List immutable posted history for an authorized account.
      parameters: [{ $ref: '#/components/parameters/AccountID' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Stable descending history page., content: { application/json: { schema: { $ref: '#/components/schemas/TransactionPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /transfers:
    get:
      operationId: listTransfers
      x-required-scope: transfers:read
      summary: Search tenant transfer outcomes.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { in: query, name: accountId, schema: { type: string, format: uuid } }
        - { in: query, name: status, description: 'Server-side financial-status filter applied before pagination.', schema: { type: string, enum: [pending, posted, rejected] } }
        - { in: query, name: q, description: 'Server-side case-insensitive substring search over transfer, source-account, and destination-account UUIDs; hexadecimal and hyphen characters only. The cursor is bound to this and every other filter.', schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[0-9A-Fa-f-]+$' } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Stable descending transfer page., content: { application/json: { schema: { $ref: '#/components/schemas/TransferPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createTransfer
      x-required-scope: transfers:write
      summary: Submit an exact internal transfer under tenant policy.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTransferRequest' } } }
      responses:
        '201':
          description: Final posted or rejected idempotent outcome.
          headers:
            Idempotent-Replay: { schema: { type: string, enum: ['true'] } }
            X-LedgerSync-Consistency-Requirements: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TransferResult' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PolicyDenied' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /transfers/{transferId}:
    get:
      operationId: getTransfer
      x-required-scope: transfers:read
      summary: Inspect a transfer, postings, and evidence timeline.
      parameters: [{ $ref: '#/components/parameters/TransferID' }]
      responses:
        '200': { description: Transfer detail., content: { application/json: { schema: { $ref: '#/components/schemas/TransferDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /investigation/search:
    get:
      operationId: searchInvestigationEvidence
      x-required-scope: investigation:read
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, events:read, reconciliation:read, corrections:read]
      summary: Locate bounded, tenant-scoped evidence by one exact approved identifier.
      description: >-
        Requires investigation:read, a tenant operator or administrator role,
        and at least one domain read scope. Domain scopes filter the returned
        record types. The lookup accepts only one complete UUID or approved
        external reference; partial and fuzzy discovery are deliberately
        unavailable. Results are safe typed locators and never include money,
        balances, event payloads, or secrets.
      parameters:
        - in: query
          name: q
          required: true
          description: One complete immutable UUID or exact approved reference.
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[A-Za-z0-9][A-Za-z0-9._:/-]{7,127})$' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200': { description: Bounded authorized locator snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationSearchPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /investigation/related/{recordType}/{recordId}:
    get:
      operationId: getRelatedInvestigationEvidence
      x-required-scope: investigation:read
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, events:read, reconciliation:read, corrections:read]
      summary: Follow bounded, deterministic relationships from one authorized record.
      description: >-
        Requires investigation:read, a tenant operator or administrator role,
        and the source domain read scope. Target domain scopes filter returned
        edges. Relationships come only from explicit tenant-scoped keys or the
        persisted reconciliation snapshot rule. No amounts, balances, payloads,
        notes, or secrets are copied into this navigation response.
      parameters:
        - in: path
          name: recordType
          required: true
          schema: { type: string, enum: [account, transfer, funding, event, reconciliation_run, reconciliation_mismatch, correction] }
        - in: path
          name: recordId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Bounded authorized relationship snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/RelationshipPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /investigation/saved-views:
    get:
      operationId: listSavedInvestigationViews
      x-required-scope: investigation:read
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, funding:approve, corrections:read, corrections:approve, events:read, webhooks:read]
      summary: List the current operator's server-owned investigation filter definitions.
      description: >-
        Returns at most 25 tenant-and-operator-scoped filter definitions. A saved
        view is never a result snapshot and contains no balances, financial
        amounts, free-text search, requesters, cursors, secrets, or payloads.
        Target paths are derived by the server from the versioned allowlist and
        open against current authorized evidence.
      responses:
        '200': { description: Current saved-view definitions., content: { application/json: { schema: { $ref: '#/components/schemas/SavedInvestigationViewPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createSavedInvestigationView
      x-required-scope: investigation:write
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, funding:approve, corrections:read, corrections:approve, events:read, webhooks:read]
      summary: Save one allowlisted operational filter definition.
      description: >-
        Requires the matching domain authority. The server validates schema
        version 1, re-derives the target path, enforces the 25-view cap and
        unique operator-local name, and records an immutable preference audit
        event without copying the name or filter values into audit metadata.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSavedInvestigationViewRequest' } } }
      responses:
        '201': { description: Saved filter definition., content: { application/json: { schema: { $ref: '#/components/schemas/SavedInvestigationView' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SavedViewConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /investigation/saved-views/{savedViewId}:
    put:
      operationId: renameSavedInvestigationView
      x-required-scope: investigation:write
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, funding:approve, corrections:read, corrections:approve, events:read, webhooks:read]
      summary: Rename an owned saved investigation view with optimistic concurrency.
      parameters: [{ $ref: '#/components/parameters/SavedViewID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameSavedInvestigationViewRequest' } } }
      responses:
        '200': { description: Renamed saved filter definition., content: { application/json: { schema: { $ref: '#/components/schemas/SavedInvestigationView' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SavedViewConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: deleteSavedInvestigationView
      x-required-scope: investigation:write
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, funding:approve, corrections:read, corrections:approve, events:read, webhooks:read]
      summary: Delete an owned saved filter definition without changing evidence.
      parameters:
        - { $ref: '#/components/parameters/SavedViewID' }
        - in: header
          name: If-Match
          required: true
          description: Quoted current saved-view version, for example "3".
          schema: { type: string, pattern: '^"[1-9][0-9]{0,18}"$' }
      responses:
        '204': { description: Saved filter definition deleted. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SavedViewConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /investigation/workspaces:
    get:
      operationId: listInvestigationWorkspaces
      x-required-scope: investigation:read
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, events:read, reconciliation:read, corrections:read]
      summary: List server-owned investigation workspaces currently assigned to the operator.
      description: >-
        Returns at most 50 tenant-and-owner-scoped summaries and filters out
        workspaces whose root domain is no longer authorized. A missing item
        never discloses whether it belongs to another operator or tenant.
      responses:
        '200': { description: Current assigned investigation summaries., content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationWorkspacePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createInvestigationWorkspace
      x-required-scope: investigation:write
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, events:read, reconciliation:read, corrections:read]
      summary: Preserve one authorized root and its bounded server-derived relationship context.
      description: >-
        Reauthorizes the root, captures only query context and at most 20
        deterministic related references, and records an immutable audit event.
        Balances, amounts, payloads, credentials and free-form notes are rejected.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvestigationWorkspaceRequest' } } } }
      responses:
        '201': { description: Created workspace with separately labeled historical context and current evidence., content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationWorkspace' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvestigationWorkspaceConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /investigation/workspaces/{investigationId}:
    get:
      operationId: getInvestigationWorkspace
      x-required-scope: investigation:read
      x-required-scopes-any: [accounts:read, transfers:read, funding:read, events:read, reconciliation:read, corrections:read]
      summary: Reopen one owned workspace against current authorized evidence.
      description: >-
        Historical query/reference context and immutable lifecycle events are
        returned separately from a newly generated current root and relationship
        snapshot. Revoked scopes and missing ownership use the same 404 boundary.
      parameters: [{ $ref: '#/components/parameters/InvestigationID' }]
      responses:
        '200': { description: Authorized investigation workspace., content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationWorkspace' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /investigation/workspaces/{investigationId}/handoff:
    post:
      operationId: handoffInvestigationWorkspace
      x-required-scope: investigation:write
      summary: Atomically transfer an open workspace to another tenant operator subject.
      parameters: [{ $ref: '#/components/parameters/InvestigationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HandoffInvestigationWorkspaceRequest' } } } }
      responses: { '200': { description: Handoff receipt; the previous owner no longer has workspace access., content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationWorkspaceReceipt' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/InvestigationWorkspaceConflict' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /investigation/workspaces/{investigationId}/close:
    post:
      operationId: closeInvestigationWorkspace
      x-required-scope: investigation:write
      summary: Close an owned open workspace without changing ledger evidence.
      parameters: [{ $ref: '#/components/parameters/InvestigationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeInvestigationWorkspaceStatusRequest' } } } }
      responses: { '200': { description: Closure receipt., content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationWorkspaceReceipt' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/InvestigationWorkspaceConflict' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /investigation/workspaces/{investigationId}/reopen:
    post:
      operationId: reopenInvestigationWorkspace
      x-required-scope: investigation:write
      summary: Reopen an owned closed workspace and refresh current evidence on the next read.
      parameters: [{ $ref: '#/components/parameters/InvestigationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeInvestigationWorkspaceStatusRequest' } } } }
      responses: { '200': { description: Reopen receipt., content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationWorkspaceReceipt' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/InvestigationWorkspaceConflict' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /reconciliation/runs:
    get:
      operationId: listReconciliationRuns
      x-required-scope: reconciliation:read
      summary: List persisted reconciliation runs.
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Stable reconciliation page., content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: runReconciliation
      x-required-scope: reconciliation:write
      summary: Run one tenant-wide reconciliation under transaction-safe single-run exclusion.
      description: >-
        Requires reconciliation:write. The request has no body and requires an
