        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/credentials/{credentialId}/rotations:
    post:
      operationId: rotateDeveloperCredential
      x-required-scope: credentials:write
      summary: Replace an external credential reference using optimistic versioning.
      description: Requires recent production step-up authentication and an identical idempotency key for unknown-outcome retry. No raw credential value crosses this API.
      parameters: [{ $ref: '#/components/parameters/CredentialID' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RotateDeveloperCredentialRequest' } } } }
      responses:
        '200': { description: Rotated credential metadata or replayed result., headers: { Idempotent-Replay: { schema: { type: string, enum: ['true'] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperCredential' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/credentials/{credentialId}/revocations:
    post:
      operationId: revokeDeveloperCredential
      x-required-scope: credentials:write
      summary: Revoke an external credential reference without deleting history.
      description: Requires recent production step-up authentication. Revocation is terminal, append-only evidence is retained, and the raw identity-provider credential must also be revoked at its authority.
      parameters: [{ $ref: '#/components/parameters/CredentialID' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeDeveloperCredentialRequest' } } } }
      responses:
        '200': { description: Revoked credential metadata or replayed result., headers: { Idempotent-Replay: { schema: { type: string, enum: ['true'] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperCredential' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/webhooks:
    get:
      operationId: listDeveloperWebhooks
      x-required-scope: webhooks:read
      summary: List stable, tenant-scoped webhook endpoint metadata.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending_verification, active, disabled] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Stable webhook page., content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhookPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: registerDeveloperWebhook
      x-required-scope: webhooks:write
      summary: Register an HTTPS endpoint and schedule server-initiated ownership verification.
      description: "Production accepts HTTPS on the standard port; sandbox additionally permits loopback HTTP. Query strings, URL credentials, signing secrets, and private keys are rejected. LedgerSync delivers an expiring challenge directly to the endpoint. The endpoint proves control by returning X-LedgerSync-Verification: v1=<HMAC-SHA256(challenge)> using its registered signing key. The API never returns the challenge or activates an endpoint."
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDeveloperWebhookRequest' } } } }
      responses:
        '201': { description: Registered endpoint with pending server-initiated verification; an idempotent replay returns the same metadata., headers: { Idempotent-Replay: { schema: { type: string, enum: ['true'] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhook' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/webhooks/{webhookId}:
    get:
      operationId: getDeveloperWebhook
      x-required-scope: webhooks:read
      summary: Read one tenant-owned webhook endpoint without signing material.
      parameters: [{ $ref: '#/components/parameters/WebhookID' }]
      responses:
        '200': { description: Webhook endpoint metadata., content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhook' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/webhooks/{webhookId}/signature-rotations:
    post:
      operationId: rotateDeveloperWebhookSignature
      x-required-scope: webhooks:write
      summary: Replace the external signing-key reference using optimistic versioning.
      description: LedgerSync records key-manager references and key IDs only. Raw signing keys never cross this boundary.
      parameters: [{ $ref: '#/components/parameters/WebhookID' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RotateDeveloperWebhookSignatureRequest' } } } }
      responses:
        '200': { description: Rotated endpoint metadata or exact replay., headers: { Idempotent-Replay: { schema: { type: string, enum: ['true'] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhook' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/webhooks/{webhookId}/disablements:
    post:
      operationId: disableDeveloperWebhook
      x-required-scope: webhooks:write
      summary: Disable future delivery while preserving endpoint and delivery history.
      parameters: [{ $ref: '#/components/parameters/WebhookID' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisableDeveloperWebhookRequest' } } } }
      responses:
        '200': { description: Disabled endpoint metadata or exact replay., headers: { Idempotent-Replay: { schema: { type: string, enum: ['true'] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhook' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/webhooks/{webhookId}/deliveries:
    get:
      operationId: listDeveloperWebhookDeliveries
      x-required-scope: webhooks:read
      summary: List bounded delivery attempts with sanitized outcomes.
      parameters: [{ $ref: '#/components/parameters/WebhookID' }, { in: query, name: status, schema: { type: string, enum: [pending, retrying, delivered, dead] } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Stable delivery page., content: { application/json: { schema: { $ref: '#/components/schemas/WebhookDeliveryPage' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/webhooks/{webhookId}/deliveries/{attemptId}/replay-approvals:
    post:
      operationId: approveDeveloperWebhookReplay
      x-required-scope: webhooks:replay
      summary: Approve replay of one immutable dead delivery attempt.
      description: Returns a durable approval identifier for an independent replay operator. X-Request-ID remains trace evidence and is not command identity.
      parameters: [{ $ref: '#/components/parameters/WebhookID' }, { $ref: '#/components/parameters/DeliveryAttemptID' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookReplayApprovalRequest' } } } }
      responses:
        '201': { description: Immutable replay approval evidence., content: { application/json: { schema: { $ref: '#/components/schemas/WebhookReplayApproval' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /developer/webhooks/{webhookId}/deliveries/{attemptId}/replays:
    post:
      operationId: replayDeveloperWebhookDelivery
      x-required-scope: webhooks:replay
      summary: Schedule a durable job for an approved dead delivery.
      description: Requires an explicit durable approval identifier and an actor other than the approver. Retrying the same intent uses the identical Idempotency-Key and returns the same job. The dead attempt and original event remain immutable; the accepted job later appends its own delivery evidence without reposting money.
      parameters: [{ $ref: '#/components/parameters/WebhookID' }, { $ref: '#/components/parameters/DeliveryAttemptID' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookReplayRequest' } } } }
      responses:
        '202': { description: Newly scheduled durable delivery job., content: { application/json: { schema: { $ref: '#/components/schemas/WebhookReplayResult' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /openapi.yaml:
    get:
      operationId: downloadOpenAPI
      x-required-scope: developer:read
      summary: Download this canonical OpenAPI YAML as a bounded read-only attachment.
      description: Requires developer:read. The response is compiled into the API binary from the reviewed canonical source.
      responses:
        '200':
          description: Canonical LedgerSync private API contract.
          headers:
            Content-Disposition: { schema: { type: string }, example: 'attachment; filename="ledgersync-openapi-3.2.0.yaml"' }
          content: { application/yaml: { schema: { type: string, maxLength: 131072 } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    actorAssertion:
      type: apiKey
      in: header
      name: X-LedgerSync-Actor-Assertion
      description: Short-lived BFF-signed end-user context bound to the workload token.
  parameters:
    AccountID: { in: path, name: accountId, required: true, schema: { type: string, format: uuid } }
    TransferID: { in: path, name: transferId, required: true, schema: { type: string, format: uuid } }
    FundingEventID: { in: path, name: fundingEventId, required: true, schema: { type: string, format: uuid } }
    CorrectionID: { in: path, name: correctionId, required: true, schema: { type: string, format: uuid } }
    RunID: { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
    CredentialID: { in: path, name: credentialId, required: true, schema: { type: string, format: uuid } }
    WebhookID: { in: path, name: webhookId, required: true, schema: { type: string, format: uuid } }
    WebhookEndpointEvidenceID: { in: path, name: endpointId, required: true, schema: { type: string, format: uuid } }
    DeliveryAttemptID: { in: path, name: attemptId, required: true, schema: { type: string, format: uuid } }
    SavedViewID: { in: path, name: savedViewId, required: true, schema: { type: string, format: uuid } }
    InvestigationID: { in: path, name: investigationId, required: true, schema: { type: string, format: uuid } }
    Cursor: { in: query, name: cursor, schema: { type: string, maxLength: 512 } }
    Limit: { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    ExportLimit: { in: query, name: limit, description: Maximum evidence rows; generation stops at this server-enforced bound., schema: { type: integer, minimum: 1, maximum: 10000, default: 10000 } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 255 } }
    CorrelationID: { in: header, name: X-Request-ID, schema: { type: string, format: uuid } }
    ConsistencyRequirement: { in: header, name: X-LedgerSync-Consistency-Requirement, schema: { type: string, maxLength: 2048 } }
  schemas:
    ExactMinor: { type: string, pattern: '^-?(0|[1-9][0-9]*)$' }
    ExactVersion: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
    Currency: { type: string, pattern: '^[A-Z]{3}$', example: INR }
    DeveloperCredentialScope:
      type: string
      enum: [accounts:read, accounts:write, events:read, funding:read, funding:write, reconciliation:read, reconciliation:write, transactions:read, transfers:read, transfers:write, webhooks:read, webhooks:write, webhooks:replay]
    DeveloperCredential:
      type: object
      additionalProperties: false
      required: [credential_id, display_name, external_reference, audience, scopes, status, version, expires_at, created_at, updated_at]
      properties:
        credential_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        external_reference: { type: string, minLength: 3, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{2,199}$', description: Non-secret identity-provider or secret-manager reference. }
        audience: { type: string, minLength: 3, maxLength: 200 }
        scopes: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { $ref: '#/components/schemas/DeveloperCredentialScope' } }
        status: { type: string, enum: [active, expired, revoked] }
        version: { type: string, pattern: '^[1-9][0-9]*$' }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time, description: Rate-bounded successful OAuth client-use evidence; null means no recorded use. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    DeveloperCredentialPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DeveloperCredential' } }
        next_cursor: { type: string, maxLength: 512 }
    CreateDeveloperCredentialRequest:
      type: object
      additionalProperties: false
      required: [display_name, external_reference, audience, scopes, expires_at]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        external_reference: { type: string, minLength: 3, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{2,199}$' }
        audience: { type: string, minLength: 3, maxLength: 200 }
        scopes: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { $ref: '#/components/schemas/DeveloperCredentialScope' } }
        expires_at: { type: string, format: date-time }
    RotateDeveloperCredentialRequest:
      type: object
      additionalProperties: false
      required: [expected_version, external_reference, audience, scopes, expires_at]
      properties:
        expected_version: { type: string, pattern: '^[1-9][0-9]*$' }
        external_reference: { type: string, minLength: 3, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{2,199}$' }
        audience: { type: string, minLength: 3, maxLength: 200 }
        scopes: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { $ref: '#/components/schemas/DeveloperCredentialScope' } }
        expires_at: { type: string, format: date-time }
    RevokeDeveloperCredentialRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: string, pattern: '^[1-9][0-9]*$' }
        reason: { type: string, minLength: 3, maxLength: 500 }
    DeveloperWebhookEvent:
      type: string
      enum: [account.created, account.status_changed, correction.posted, funding.posted, reconciliation.completed, transfer.posted, transfer.rejected]
    DeveloperWebhook:
      type: object
      additionalProperties: false
      required: [webhook_id, display_name, endpoint_url, subscribed_events, signing_key_reference, signing_key_id, status, version, created_at, updated_at]
      properties:
        webhook_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        endpoint_url: { type: string, format: uri, maxLength: 2048 }
