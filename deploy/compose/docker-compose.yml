services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgersync
      POSTGRES_USER: ledgersync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgersync -d ledgersync"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_HTTP_ADDR: :8080
      LEDGERSYNC_PILOT_CURRENCY: USD
      LEDGERSYNC_READ_RATE_LIMIT_PER_MINUTE: ${LEDGERSYNC_READ_RATE_LIMIT_PER_MINUTE:-120}
      LEDGERSYNC_WRITE_RATE_LIMIT_PER_MINUTE: ${LEDGERSYNC_WRITE_RATE_LIMIT_PER_MINUTE:-30}
      LEDGERSYNC_REDIS_STREAM_MAX_LENGTH: 5000000
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync:${POSTGRES_PASSWORD:-development-only-change-me}@postgres:5432/ledgersync?sslmode=disable
      LEDGERSYNC_REDIS_ADDR: redis:6379
      LEDGERSYNC_SESSION_SECRET: ${LEDGERSYNC_SESSION_SECRET:-development-only-change-me}
      LEDGERSYNC_CONSISTENCY_SIGNING_KEY: ${LEDGERSYNC_CONSISTENCY_SIGNING_KEY:-development-only-change-me-change-before-shared-use}
      LEDGERSYNC_BFF_ASSERTION_SECRET: ${LEDGERSYNC_BFF_ASSERTION_SECRET:-development-bff-assertion-secret-change-me}
      LEDGERSYNC_DEVELOPMENT_SUBJECT_ID: demo-operator
      LEDGERSYNC_DEVELOPMENT_TENANT_ID: 00000000-0000-4000-8000-000000000001
    depends_on:
      demo-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  outbox-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/outbox-worker.Dockerfile
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync:${POSTGRES_PASSWORD:-development-only-change-me}@postgres:5432/ledgersync?sslmode=disable
      LEDGERSYNC_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      LEDGERSYNC_PRIVATE_API_URL: http://api:8080
      LEDGERSYNC_PRIVATE_API_TOKEN: development-local-only
      LEDGERSYNC_WEB_SESSION_SECRET: ${LEDGERSYNC_WEB_SESSION_SECRET:-development-web-session-secret-change-me}
      LEDGERSYNC_BFF_ASSERTION_SECRET: ${LEDGERSYNC_BFF_ASSERTION_SECRET:-development-bff-assertion-secret-change-me}
      LEDGERSYNC_DEPLOYMENT_ENV: development
      LEDGERSYNC_COOKIE_SECURE: "false"
      LEDGERSYNC_PUBLIC_ORIGIN: http://localhost:3000
      LEDGERSYNC_DEMO_MODE: "true"
      LEDGERSYNC_DEMO_SUBJECT_ID: demo-operator
      LEDGERSYNC_DEMO_TENANT_ID: 00000000-0000-4000-8000-000000000001
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    networks: [edge, private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync:${POSTGRES_PASSWORD:-development-only-change-me}@postgres:5432/ledgersync?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"

  demo-seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    command: ["psql", "-h", "postgres", "-U", "ledgersync", "-d", "ledgersync", "-f", "/seed/demo-seed.sql"]
    volumes:
      - ./demo-seed.sql:/seed/demo-seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    restart: "no"

  legacy-simulation:
    # This intentionally remains a diagnostics-only profile and never joins the
    # edge network or publishes a port. It is excluded from pilot deployment.
    profiles: [diagnostic]
    image: python:3.11-slim
    command: ["sh", "-c", "echo 'Legacy simulation is deliberately excluded from the production runtime'; sleep infinity"]
    networks: [private]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  private:
    internal: true

volumes:
  postgres-data:
  redis-data:
