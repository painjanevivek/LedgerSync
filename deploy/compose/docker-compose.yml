services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # Long-lived local authority must return with Docker Desktop. Normal stop/start
    # preserves the named volume; reset is a separate explicit operation.
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ledgersync
      POSTGRES_USER: ledgersync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start-local.ps1 to create local secrets}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgersync -d ledgersync"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    user: postgres
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/run/postgresql:rw,noexec,nosuid,size=4m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # Redis is disposable, but automatic restart keeps the local read path usable
    # after an ordinary Docker daemon event.
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30
    volumes:
      - redis-data:/data
    networks: [private]
    user: redis
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      # Build-time TLS compatibility for Docker Desktop proxies. Certificate and
      # module checksum checks stay enabled; this does not set runtime GODEBUG.
      args:
        GO_BUILD_GODEBUG: ${LEDGERSYNC_GO_BUILD_GODEBUG-tlsmlkem=0}
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_HTTP_ADDR: :8080
      LEDGERSYNC_STARTUP_TIMEOUT: 90s
      LEDGERSYNC_STARTUP_INITIAL_BACKOFF: 250ms
      LEDGERSYNC_STARTUP_MAX_BACKOFF: 5s
      LEDGERSYNC_PILOT_CURRENCY: INR
      LEDGERSYNC_READ_RATE_LIMIT_PER_MINUTE: ${LEDGERSYNC_READ_RATE_LIMIT_PER_MINUTE:-6000}
      LEDGERSYNC_WRITE_RATE_LIMIT_PER_MINUTE: ${LEDGERSYNC_WRITE_RATE_LIMIT_PER_MINUTE:-1800}
      LEDGERSYNC_WRITE_CAPACITY_PER_SECOND: ${LEDGERSYNC_WRITE_CAPACITY_PER_SECOND:-30}
      LEDGERSYNC_REDIS_STREAM_MAX_LENGTH: 5000000
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync_local_api:${LEDGERSYNC_API_DATABASE_PASSWORD:?Local API database secret is required}@postgres:5432/ledgersync?sslmode=disable
      LEDGERSYNC_REDIS_ADDR: redis:6379
      LEDGERSYNC_LIVE_INVESTIGATION_ENABLED: ${LEDGERSYNC_LIVE_INVESTIGATION_ENABLED:-false}
      LEDGERSYNC_LIVE_INVESTIGATION_NAMESPACE: ledgersync:investigation-live:local
      LEDGERSYNC_SESSION_SECRET: ${LEDGERSYNC_SESSION_SECRET:?Local API session secret is required}
      LEDGERSYNC_CONSISTENCY_SIGNING_KEY: ${LEDGERSYNC_CONSISTENCY_SIGNING_KEY:?Local consistency signing key is required}
      LEDGERSYNC_BFF_ASSERTION_SECRET: ${LEDGERSYNC_BFF_ASSERTION_SECRET:?Local BFF assertion secret is required}
      LEDGERSYNC_DEVELOPMENT_API_TOKEN: ${LEDGERSYNC_DEVELOPMENT_API_TOKEN:?Local private API token is required}
      LEDGERSYNC_DEVELOPMENT_SUBJECT_ID: local-user
      LEDGERSYNC_DEVELOPMENT_TENANT_ID: 00000000-0000-4000-8000-000000000001
      LEDGERSYNC_RECOVERY_EVIDENCE_ROOT: /run/ledgersync/recovery
    depends_on:
      demo-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 30
    networks: [private]
    volumes:
      # The API receives only the sanitized tooling index, never backup dumps or
      # the host backup directory. start-local initializes this exact file.
      - ../../data/local-backups/recovery-evidence-index.json:/run/ledgersync/recovery/recovery-evidence-index.json:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  outbox-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/outbox-worker.Dockerfile
      args:
        GO_BUILD_GODEBUG: ${LEDGERSYNC_GO_BUILD_GODEBUG-tlsmlkem=0}
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync_local_worker:${LEDGERSYNC_WORKER_DATABASE_PASSWORD:?Local worker database secret is required}@postgres:5432/ledgersync?sslmode=disable
      LEDGERSYNC_REDIS_ADDR: redis:6379
      LEDGERSYNC_STARTUP_TIMEOUT: 90s
      LEDGERSYNC_STARTUP_INITIAL_BACKOFF: 250ms
      LEDGERSYNC_STARTUP_MAX_BACKOFF: 5s
    depends_on:
      demo-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/outbox-worker", "--healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 3
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      LEDGERSYNC_PRIVATE_API_URL: http://api:8080
      LEDGERSYNC_PRIVATE_API_TOKEN: ${LEDGERSYNC_DEVELOPMENT_API_TOKEN:?Local private API token is required}
      LEDGERSYNC_WEB_SESSION_SECRET: ${LEDGERSYNC_WEB_SESSION_SECRET:?Local web session secret is required}
      LEDGERSYNC_BFF_ASSERTION_SECRET: ${LEDGERSYNC_BFF_ASSERTION_SECRET:?Local BFF assertion secret is required}
      LEDGERSYNC_DEPLOYMENT_ENV: development
      LEDGERSYNC_COOKIE_SECURE: "false"
      LEDGERSYNC_PUBLIC_ORIGIN: http://127.0.0.1:3000
      LEDGERSYNC_LOCAL_LOGIN_ENABLED: "true"
      LEDGERSYNC_LOCAL_SUBJECT_ID: local-user
      LEDGERSYNC_LOCAL_TENANT_ID: 00000000-0000-4000-8000-000000000001
      LEDGERSYNC_LIVE_INVESTIGATION_ENABLED: ${LEDGERSYNC_LIVE_INVESTIGATION_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30
    ports: ["127.0.0.1:3000:3000"]
    networks: [edge, private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web-peer:
    profiles: ["collaboration"]
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      LEDGERSYNC_PRIVATE_API_URL: http://api:8080
      LEDGERSYNC_PRIVATE_API_TOKEN: ${LEDGERSYNC_DEVELOPMENT_API_TOKEN:?Local private API token is required}
      LEDGERSYNC_WEB_SESSION_SECRET: ${LEDGERSYNC_WEB_SESSION_SECRET:?Local web session secret is required}
      LEDGERSYNC_BFF_ASSERTION_SECRET: ${LEDGERSYNC_BFF_ASSERTION_SECRET:?Local BFF assertion secret is required}
      LEDGERSYNC_DEPLOYMENT_ENV: development
      LEDGERSYNC_COOKIE_SECURE: "false"
      LEDGERSYNC_PUBLIC_ORIGIN: http://127.0.0.1:3001
      LEDGERSYNC_LOCAL_LOGIN_ENABLED: "true"
      LEDGERSYNC_LOCAL_SUBJECT_ID: local-peer
      LEDGERSYNC_LOCAL_TENANT_ID: 00000000-0000-4000-8000-000000000001
      LEDGERSYNC_LIVE_INVESTIGATION_ENABLED: ${LEDGERSYNC_LIVE_INVESTIGATION_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    healthcheck:
      # The process listens on container port 3000 but accepts HTTP only for
      # the published 3001 origin. Check process readiness here; the smoke test
      # verifies the real host-validating browser path through port 3001.
      test: ["CMD", "node", "-e", "const net=require('node:net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30
    ports: ["127.0.0.1:3001:3000"]
    networks: [edge, private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      target: database-tooling
      args:
        GO_BUILD_GODEBUG: ${LEDGERSYNC_GO_BUILD_GODEBUG-tlsmlkem=0}
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        /usr/local/bin/migrate &&
        exec psql --single-transaction -v ON_ERROR_STOP=1 -h postgres -U ledgersync -d ledgersync
        -f /database-roles/roles.sql -f /database-roles/local-workload-logins.sql
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync:${POSTGRES_PASSWORD:?Local PostgreSQL secret is required}@postgres:5432/ledgersync?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:?Local PostgreSQL secret is required}
      LEDGERSYNC_API_DATABASE_PASSWORD: ${LEDGERSYNC_API_DATABASE_PASSWORD:?Local API database secret is required}
      LEDGERSYNC_WORKER_DATABASE_PASSWORD: ${LEDGERSYNC_WORKER_DATABASE_PASSWORD:?Local worker database secret is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"
    user: postgres
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  demo-seed:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Local PostgreSQL secret is required}
      LEDGERSYNC_INITIALIZATION_MODE: ${LEDGERSYNC_INITIALIZATION_MODE:-empty}
    command:
      - "sh"
      - "-ec"
      - >-
        psql -h postgres -U ledgersync -d ledgersync -f /seed/local-bootstrap.sql &&
        case "$${LEDGERSYNC_INITIALIZATION_MODE}" in
          demo) exec psql -h postgres -U ledgersync -d ledgersync -f /seed/demo-seed.sql ;;
          empty) echo 'Fresh workspace initialized without sample financial records.' ;;
          *) echo 'Unsupported LedgerSync initialization mode.' >&2; exit 64 ;;
        esac
    volumes:
      - ./local-bootstrap.sql:/seed/local-bootstrap.sql:ro
      - ./demo-seed.sql:/seed/demo-seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    restart: "no"
    user: postgres
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  private:
    internal: true

volumes:
  postgres-data:
  redis-data:
