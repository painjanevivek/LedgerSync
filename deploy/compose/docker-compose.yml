services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    # Long-lived local authority must return with Docker Desktop. Normal stop/start
    # preserves the named volume; reset is a separate explicit operation.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgersync
      POSTGRES_USER: ledgersync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start-local.ps1 to create local secrets}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgersync -d ledgersync"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    user: postgres
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/run/postgresql:rw,noexec,nosuid,size=4m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    # Redis is disposable, but automatic restart keeps the local read path usable
    # after an ordinary Docker daemon event.
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30
    volumes:
      - redis-data:/data
    networks: [private]
    user: redis
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_HTTP_ADDR: :8080
      LEDGERSYNC_STARTUP_TIMEOUT: 90s
      LEDGERSYNC_STARTUP_INITIAL_BACKOFF: 250ms
      LEDGERSYNC_STARTUP_MAX_BACKOFF: 5s
      LEDGERSYNC_PILOT_CURRENCY: INR
      LEDGERSYNC_READ_RATE_LIMIT_PER_MINUTE: ${LEDGERSYNC_READ_RATE_LIMIT_PER_MINUTE:-6000}
      LEDGERSYNC_WRITE_RATE_LIMIT_PER_MINUTE: ${LEDGERSYNC_WRITE_RATE_LIMIT_PER_MINUTE:-1800}
      LEDGERSYNC_WRITE_CAPACITY_PER_SECOND: ${LEDGERSYNC_WRITE_CAPACITY_PER_SECOND:-30}
      LEDGERSYNC_REDIS_STREAM_MAX_LENGTH: 5000000
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync:${POSTGRES_PASSWORD:?Local PostgreSQL secret is required}@postgres:5432/ledgersync?sslmode=disable
      LEDGERSYNC_REDIS_ADDR: redis:6379
      LEDGERSYNC_SESSION_SECRET: ${LEDGERSYNC_SESSION_SECRET:?Local API session secret is required}
      LEDGERSYNC_CONSISTENCY_SIGNING_KEY: ${LEDGERSYNC_CONSISTENCY_SIGNING_KEY:?Local consistency signing key is required}
      LEDGERSYNC_BFF_ASSERTION_SECRET: ${LEDGERSYNC_BFF_ASSERTION_SECRET:?Local BFF assertion secret is required}
      LEDGERSYNC_DEVELOPMENT_API_TOKEN: ${LEDGERSYNC_DEVELOPMENT_API_TOKEN:?Local private API token is required}
      LEDGERSYNC_DEVELOPMENT_SUBJECT_ID: demo-operator
      LEDGERSYNC_DEVELOPMENT_TENANT_ID: 00000000-0000-4000-8000-000000000001
    depends_on:
      demo-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 30
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  outbox-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/outbox-worker.Dockerfile
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync:${POSTGRES_PASSWORD:?Local PostgreSQL secret is required}@postgres:5432/ledgersync?sslmode=disable
      LEDGERSYNC_REDIS_ADDR: redis:6379
      LEDGERSYNC_STARTUP_TIMEOUT: 90s
      LEDGERSYNC_STARTUP_INITIAL_BACKOFF: 250ms
      LEDGERSYNC_STARTUP_MAX_BACKOFF: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[o]utbox-worker'"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 30
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      LEDGERSYNC_PRIVATE_API_URL: http://api:8080
      LEDGERSYNC_PRIVATE_API_TOKEN: ${LEDGERSYNC_DEVELOPMENT_API_TOKEN:?Local private API token is required}
      LEDGERSYNC_WEB_SESSION_SECRET: ${LEDGERSYNC_WEB_SESSION_SECRET:?Local web session secret is required}
      LEDGERSYNC_BFF_ASSERTION_SECRET: ${LEDGERSYNC_BFF_ASSERTION_SECRET:?Local BFF assertion secret is required}
      LEDGERSYNC_DEPLOYMENT_ENV: development
      LEDGERSYNC_COOKIE_SECURE: "false"
      LEDGERSYNC_PUBLIC_ORIGIN: http://127.0.0.1:3000
      LEDGERSYNC_DEMO_MODE: "true"
      LEDGERSYNC_DEMO_SUBJECT_ID: demo-operator
      LEDGERSYNC_DEMO_TENANT_ID: 00000000-0000-4000-8000-000000000001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30
    ports: ["127.0.0.1:3000:3000"]
    networks: [edge, private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      LEDGERSYNC_ENV: development
      LEDGERSYNC_DATABASE_URL: postgres://ledgersync:${POSTGRES_PASSWORD:?Local PostgreSQL secret is required}@postgres:5432/ledgersync?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  demo-seed:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Local PostgreSQL secret is required}
    command: ["psql", "-h", "postgres", "-U", "ledgersync", "-d", "ledgersync", "-f", "/seed/demo-seed.sql"]
    volumes:
      - ./demo-seed.sql:/seed/demo-seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    restart: "no"
    user: postgres
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  legacy-simulation:
    # This intentionally remains a diagnostics-only profile and never joins the
    # edge network or publishes a port. It is excluded from pilot deployment.
    profiles: [diagnostic]
    image: python:3.11-slim@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7
    command: ["sh", "-c", "echo 'Legacy simulation is deliberately excluded from the production runtime'; sleep infinity"]
    networks: [private]
    user: "65532:65532"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  private:
    internal: true

volumes:
  postgres-data:
  redis-data:
