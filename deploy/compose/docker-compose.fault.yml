services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ledgersync
      POSTGRES_USER: ledgersync
      POSTGRES_PASSWORD: fault-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgersync -d ledgersync"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [fault-private]

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "no"]
    networks: [fault-private]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-config", "/config/toxiproxy.json"]
    volumes: ["./toxiproxy.json:/config/toxiproxy.json:ro"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:18474:8474"
      - "127.0.0.1:15432:15432"
      - "127.0.0.1:16379:16379"
    networks: [fault-private]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

networks:
  fault-private:
    # PostgreSQL and Redis have no published ports; only Toxiproxy exposes
    # loopback-bound test endpoints. Keeping this bridge non-internal is
    # required by Docker Desktop for those published ports to reach the host.
    driver: bridge
