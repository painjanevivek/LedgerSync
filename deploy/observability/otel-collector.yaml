receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s
    send_batch_size: 64
    send_batch_max_size: 128

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
  otlphttp/traces:
    endpoint: ${env:LEDGERSYNC_TRACE_BACKEND_ENDPOINT}
    timeout: 1s
    sending_queue:
      queue_size: 512
    retry_on_failure:
      enabled: false
    tls:
      insecure: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
