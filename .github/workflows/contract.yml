name: Contract validation

on:
  pull_request:
    paths: [contracts/**, cmd/api/**, internal/application/**, internal/transport/http/**, tests/contract/**, deploy/compose/docker-compose.restore.yml, deploy/compose/docker-compose.fault.yml, web/package.json, web/package-lock.json, .github/workflows/contract.yml, .github/workflows/quality.yml, .github/workflows/release-evidence.yml]
  push:
    branches: [main]
    paths: [contracts/**, cmd/api/**, internal/application/**, internal/transport/http/**, tests/contract/**, deploy/compose/docker-compose.restore.yml, deploy/compose/docker-compose.fault.yml, web/package.json, web/package-lock.json, .github/workflows/contract.yml, .github/workflows/quality.yml, .github/workflows/release-evidence.yml]

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, check-latest: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: ./node_modules/.bin/redocly lint ../contracts/openapi.yaml
        working-directory: web
      - run: go test ./tests/contract
