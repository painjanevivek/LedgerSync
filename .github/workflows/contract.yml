name: Contract validation

on:
  pull_request:
    paths: [contracts/**, .github/workflows/contract.yml]
  push:
    branches: [main]
    paths: [contracts/**, .github/workflows/contract.yml]

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npx --yes @redocly/cli@1.34.0 lint contracts/openapi.yaml
