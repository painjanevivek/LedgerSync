name: Supply-chain and security gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  secrets-dependencies-and-iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Scan compose and infrastructure configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: HIGH,CRITICAL
          exit-code: 1
  containers-and-provenance:
    runs-on: ubuntu-24.04
    needs: secrets-dependencies-and-iac
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable scan targets
        run: |
          docker build -f deploy/docker/api.Dockerfile -t ledgersync-api:${{ github.sha }} .
          docker build -f deploy/docker/outbox-worker.Dockerfile -t ledgersync-worker:${{ github.sha }} .
          docker build -f deploy/docker/web.Dockerfile -t ledgersync-web:${{ github.sha }} .
      - name: Scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ledgersync-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Scan worker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ledgersync-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ledgersync-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: ledgersync-sbom
          output-file: sbom.spdx.json
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: sbom.spdx.json
