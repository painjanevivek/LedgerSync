name: Production-path CI

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - go.work
      - .tool-versions
      - .dockerignore
      - .github/workflows/ci.yml
      - cmd/**
      - internal/**
      - migrations/**
      - contracts/**
      - deploy/**
      - tests/**
      - web/**
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - go.work
      - .tool-versions
      - .dockerignore
      - .github/workflows/ci.yml
      - cmd/**
      - internal/**
      - migrations/**
      - contracts/**
      - deploy/**
      - tests/**
      - web/**

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: go vet ./cmd/... ./internal/... ./tests/...
      - run: go test -race ./cmd/... ./internal/... ./tests/...
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f deploy/compose/docker-compose.yml config --quiet
      - run: docker build -f deploy/docker/api.Dockerfile .
      - run: docker build -f deploy/docker/outbox-worker.Dockerfile .
      - run: docker build -f deploy/docker/web.Dockerfile .
