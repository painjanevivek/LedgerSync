name: Production-path CI

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - go.work
      - .tool-versions
      - .dockerignore
      - .github/workflows/ci.yml
      - cmd/**
      - internal/**
      - migrations/**
      - contracts/**
      - deploy/**
      - tests/**
      - web/**
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - go.work
      - .tool-versions
      - .dockerignore
      - .github/workflows/ci.yml
      - cmd/**
      - internal/**
      - migrations/**
      - contracts/**
      - deploy/**
      - tests/**
      - web/**

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, check-latest: true }
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: go vet ./cmd/... ./internal/... ./tests/...
      - run: go test -race ./cmd/... ./internal/... ./tests/...
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Compose with ephemeral CI secrets
        shell: bash
        run: |
          for variable in \
            POSTGRES_PASSWORD \
            LEDGERSYNC_API_DATABASE_PASSWORD \
            LEDGERSYNC_WORKER_DATABASE_PASSWORD \
            LEDGERSYNC_SESSION_SECRET \
            LEDGERSYNC_CONSISTENCY_SIGNING_KEY \
            LEDGERSYNC_BFF_ASSERTION_SECRET \
            LEDGERSYNC_DEVELOPMENT_API_TOKEN \
            LEDGERSYNC_WEB_SESSION_SECRET
          do
            printf -v "$variable" '%s' "$(openssl rand -hex 32)"
            export "$variable"
          done
          docker compose -f deploy/compose/docker-compose.yml config --quiet
      - run: docker build -f deploy/docker/api.Dockerfile .
      - run: docker build -f deploy/docker/outbox-worker.Dockerfile .
      - run: docker build -f deploy/docker/web.Dockerfile .
