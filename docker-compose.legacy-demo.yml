# LEGACY DEMONSTRATION REFERENCE ONLY.
#
# This topology predates the financially correct production path and must not
# be used for development, pilot, staging, or production deployment. Use
# docker-compose.yml or deploy/compose/docker-compose.yml instead.
name: ledgersync-legacy-demo-do-not-use
version: '3.8'

services:
  # PostgreSQL primary database
  postgres-primary:
    image: postgres:15
    container_name: postgres-primary
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintech
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./setup/postgres-setup.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL replica database (read-only)
  postgres-replica:
    image: postgres:15
    container_name: postgres-replica
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintech
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      postgres
      -c hot_standby=on
      -c max_wal_senders=10
      -c wal_keep_size=64
      -c wal_level=replica
    # Note: In a real setup, you would use replication slots and configure the primary to send WAL to the replica.
    # For simplicity, we are not setting up replication here, but the structure is there.

  # Redis for caching and pub/sub (using Redis Streams for event bus)
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - ./setup/redis-config.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  # Go services
  account-service:
    build: ./backend/account_service
    container_name: account-service
    ports:
      - "50051:50051"
    environment:
      - POSTGRES_HOST=postgres-primary
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fintech
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy

  cache-service:
    build: ./backend/cache_service
    container_name: cache-service
    ports:
      - "50052:50052"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  event-bus:
    build: ./backend/event_bus
    container_name: event-bus
    ports:
      - "50053:50053"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    build: ./backend/auth
    container_name: auth-service
    ports:
      - "50054:50054"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  # Python simulation dashboard
  sim-service:
    build: ./simulation
    container_name: sim-service
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  # Next.js frontend dashboard
  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:50051
      - NEXT_PUBLIC_SIM_URL=http://localhost:8000
    depends_on:
      account-service:
        condition: service_healthy
      sim-service:
        condition: service_healthy

volumes:
  postgres-primary-data:
  postgres-replica-data:
  redis-data:
