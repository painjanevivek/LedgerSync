syntax = "proto3";

package balance;

// Balance service definition
service BalanceService {
  // Transfer money from one account to another
  rpc Transfer(TransferRequest) returns (TransferResponse);

  // Get balance for an account (with read-your-writes support)
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

// Request to transfer money
message TransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  double amount = 3;
}

// Response from transfer operation
message TransferResponse {
  bool success = 1;
  string message = 2;
  string ryew_token = 3; // Read-your-writes token for consistent reads
}

// Request to get balance
message GetBalanceRequest {
  string account_id = 1;
  string ryew_token = 2; // Optional read-your-writes token
}

// Response containing balance information
message GetBalanceResponse {
  double balance = 1;
  string currency = 2;
  bool is_stale = 3; // Indicates if the balance might be stale
}